<!doctype html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agendamento — Barbearia Beco 7</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Work+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" th:href="@{/css/estilo.css}" />
  </head>

  <body>
    <div class="app">
      <div
        th:replace="~{fragments/comuns :: menu-lateral(pagina='agendamento')}"
      ></div>

      <div class="area-principal">
        <main class="conteudo">
          <div class="container">
            <div
              class="mensagem erro"
              th:if="${erro}"
              th:text="${erro}"
              style="margin-bottom: 20px"
            ></div>
            <div
              class="mensagem"
              th:if="${mensagem}"
              th:text="${mensagem}"
              style="
                margin-bottom: 20px;
                background: rgba(15, 91, 58, 0.2);
                border: 1px solid #0f5b3a;
                color: #8fe0b8;
              "
            ></div>
            <div class="pagina-cabecalho">
              <div>
                <h1>Agendamento</h1>
                <p>
                  Selecione o cliente e escolha o dia e o horário do
                  atendimento.
                </p>
              </div>
            </div>

            <div class="grade-2">
              <form
                class="cartao formulario"
                th:action="@{/agendamento}"
                method="post"
              >
                <h3>Novo agendamento</h3>

                <div class="campo">
                  <label for="clienteId">Cliente</label>
                  <select id="clienteId" name="clienteId" required>
                    <option value="">Selecione o cliente</option>
                    <option
                      th:each="item : ${clientes}"
                      th:value="${item.id}"
                      th:text="${item.nome}"
                    >
                      João Silva
                    </option>
                  </select>
                </div>

                <div class="campo">
                  <label for="servico">Serviço</label>
                  <select id="servico" name="servico" required>
                    <option value="corte">Corte</option>
                    <option value="barba">Barba</option>
                    <option value="corte-barba">Corte + Barba</option>
                  </select>
                </div>

                <div class="campo">
                  <label for="data">Dia</label>
                  <input id="data" name="data" type="date" required />
                </div>

                <div class="campo">
                  <label>Horário</label>
                  <div class="grade-horarios">
                    <div
                      class="horario-opcao"
                      th:each="h : ${horariosDisponiveis}"
                      th:text="${h}"
                    >
                      08:00
                    </div>
                  </div>
                  <input type="hidden" name="horario" />
                  <input type="hidden" name="barbeiroId" value="1" />
                  <input type="hidden" name="status" value="Agendado" />
                </div>

                <div class="acoes-formulario">
                  <button type="submit" class="botao botao-primario">
                    Confirmar agendamento
                  </button>
                </div>
              </form>

              <div class="cartao">
                <h3>Agendamentos do dia</h3>
                <div class="agenda-lista">
                  <div
                    class="agenda-linha"
                    th:each="item : ${agendamentosDoDia}"
                  >
                    <span class="hora" th:text="${item.horario}">08:00</span>
                    <span th:text="${item.cliente} + ' · ' + ${item.servico}"
                      >João Silva · Corte</span
                    >
                    <span
                      class="selo"
                      th:classappend="'selo-' + ${item.statusCss}"
                      th:text="${item.status}"
                      >Confirmado</span
                    >
                    <button
                      type="button"
                      class="botao botao-pequeno botao-perigo"
                      data-abrir-modal="modal-cancelar-agendamento"
                      th:data-form-action="@{'/agendamento/' + ${item.id}}"
                      th:data-descricao="'Cancelar o agendamento de ' + ${item.cliente} + '?'"
                    >
                      Cancelar
                    </button>
                  </div>
                  <p class="vazio" th:if="${#lists.isEmpty(agendamentosDoDia)}">
                    Nenhum agendamento para o dia.
                  </p>
                </div>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>

    <div
      th:replace="~{fragments/comuns :: modal-confirmacao(
        id='modal-cancelar-agendamento',
        titulo='Cancelar agendamento?',
        mensagem='Tem certeza que deseja cancelar este agendamento?',
        rotuloBotao='Cancelar agendamento')}"
    ></div>

    <script th:src="@{/js/app.js}" defer></script>
  </body>
</html>
